<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العيادة - نسخة الموظف</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #000; color: #fff; margin: 0; font-family: sans-serif;">

    <!-- 1. شاشة قفل التطبيق (طلب كود الموظف السري) -->
    <div id="login-screen-ui" style="text-align: center; padding: 30px; background-color: #111; color: #fff; height: 100vh; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box;">
        <h2 style="color: #d4af37; margin-bottom: 10px; font-size: 28px;">نظام إدارة العيادة ✚</h2>
        <p style="margin-bottom: 25px; font-size: 16px; color: #ccc;">الرجاء إدخال كود الموظف لتفعيل النظام في هذا الهاتف</p>
        
        <input type="password" id="employee-code-input" placeholder="أدخل الكود السري هنا" style="padding: 14px; width: 260px; text-align: center; border: 2px solid #d4af37; background: #222; color: #fff; font-size: 18px; border-radius: 8px; margin-bottom: 20px; outline: none;">
        
        <button onclick="checkEmployeeCode()" style="padding: 14px 40px; background-color: #d4af37; color: black; border: none; cursor: pointer; font-weight: bold; border-radius: 8px; font-size: 16px; transition: 0.3s;">
            دخول النظام
        </button>
    </div>

    <!-- 2. واجهة التطبيق الرئيسية (نظام العيادة الخاص بك) -->
    <div id="app-main-content">
        <header style="padding: 20px; text-align: center; border-bottom: 1px solid #222;">
            <h1 style="color: #d4af37; margin: 0;">لوحة تحكم العيادة</h1>
            <p style="color: #aaa; margin: 5px 0 0 0;">نظام الحجوزات والمتابعة اليومية</p>
        </header>

        <main style="padding: 20px; text-align: center; margin-top: 50px;">
            <p style="font-size: 18px; color: #aaa;">شاشات وأدوات إدارة العيادة ستعمل هنا تلقائياً بمجرد فتح القفل...</p>
        </main>
    </div>

    <!-- ربط ملف البرمجة الحركية الخاص بك -->
    <script src="app.js"></script>
</body>
</html>
