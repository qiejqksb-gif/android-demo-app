
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b13">
  <title>يوسف | إدارة العيادة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="login-screen-ui"></div>

  <header>
    <h1>يوسف | إدارة العيادة</h1>
    <p>نظام الحجوزات والمتابعة اليومية</p>
    <button id="logout-button" type="button">تسجيل الخروج</button>
  </header>

  <main>
    <section>
      <h2>الإحصائيات</h2>
      <p>إجمالي الحجوزات: <span id="count">0</span></p>
      <p>حجوزات اليوم: <span id="today">0</span></p>
      <section id="revenue-section" data-admin-only>
        <h3>الحسابات وأجور الكشفية</h3>
        <p id="revenue">—</p>
        <p id="revenue-report">—</p>
      </section>
    </section>

    <section>
      <h2>حجوزات المرضى</h2>
      <label for="search">البحث بالاسم أو الهاتف</label>
      <input id="search" type="search" placeholder="ابحث عن مريض">

      <label for="filterDate">تصفية حسب التاريخ</label>
      <input id="filterDate" type="date">

      <button id="clearFilters" type="button">مسح التصفية</button>
      <button id="add" type="button">إضافة حجز جديد</button>
      <p id="connection" class="connection">بانتظار الاتصال</p>
      <div id="list"></div>
    </section>

    <dialog id="dlg">
      <form id="form">
        <h2>تسجيل حجز جديد</h2>

        <label for="name">اسم المريض *</label>
        <input id="name" name="name" required>

        <label for="age">العمر</label>
        <input id="age" name="age" type="number" min="0">

        <label for="phone">رقم الهاتف</label>
        <input id="phone" name="phone" type="tel">

        <label for="doctor">اسم الطبيب</label>
        <input id="doctor" name="doctor">

        <label for="specialty">الاختصاص</label>
        <input id="specialty" name="specialty">

        <label for="bookingDate">تاريخ الحجز *</label>
        <input id="bookingDate" name="date" type="date" required>

        <label for="time">وقت الحجز</label>
        <input id="time" name="time" type="time">

        <label for="fee">أجرة الكشفية (د.ع)</label>
        <input id="fee" name="fee" type="number" min="0">

        <label for="status">حالة الحجز</label>
        <select id="status" name="status">
          <option value="محجوز">محجوز</option>
          <option value="حضر">حضر</option>
          <option value="ملغي">ملغي</option>
        </select>

        <label for="notes">ملاحظات</label>
        <textarea id="notes" name="notes"></textarea>

        <button id="saveBooking" type="submit">حفظ الحجز</button>
        <button id="cancel" type="button">إلغاء</button>
      </form>
    </dialog>
  </main>

  <script type="module" src="app.js"></script>
</body>
                                       </html>
